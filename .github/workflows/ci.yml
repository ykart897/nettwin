name: NetTwin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
          python -m pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev
          npm test
          npm run build

      - name: Browser acceptance test
        working-directory: frontend
        env:
          NETTWIN_DISABLE_SCHEDULER: "1"
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: API soak smoke test
        working-directory: backend
        env:
          NETTWIN_DISABLE_SCHEDULER: "1"
          NETTWIN_RELOAD: "0"
        run: |
          python run.py --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/health/ready && break
            sleep 1
          done
          python -m scripts.soak_test --duration 5 --interval 0.1 --concurrency 6
