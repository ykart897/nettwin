services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: nettwin
      POSTGRES_USER: nettwin
      POSTGRES_PASSWORD: nettwin-local
    ports:
      - "5432:5432"
    volumes:
      - nettwin-timescale:/var/lib/postgresql/data
      - ./backend/sql/timescale-init.sql:/docker-entrypoint-initdb.d/10-timescale-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nettwin -d nettwin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nettwin-timescale:
